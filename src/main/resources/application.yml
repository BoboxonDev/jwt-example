server:
  port: 8080
  forward-headers-strategy: framework

spring:
  application:
    name: pos

  datasource:
    url: jdbc:postgresql://localhost:5432/pos-db
    username: postgres
    password: 123456
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  liquibase:
    enabled: false

  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB

  mvc:
    pathmatch:                      # ✅ to‘g‘rilandi
      matching-strategy: ant_path_matcher

jwt:
  secret: c8d4b399-edf7-45b9-aea0-e4a2e83db6a3
  expiration: 36000000
  refresh-token-expiration: 2592000000

minio:
  url: http://localhost:9090
  access-key: minioadmin
  secret-key: minioadmin
  bucket: jwtexample
  max-size: 50MB

logging:                            # ✅ qo‘shildi
  level:
    org.springdoc: DEBUG
    org.springframework.web: DEBUG
    org.springframework.boot.web.servlet: DEBUG
